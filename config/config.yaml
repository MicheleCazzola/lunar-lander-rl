algorithm: expected_sarsa
episodes: 1200
runs: 30
output_dir: temp

lr: 0.001
gamma: 0.99
tau: 0.001
batch_size: 256
buffer_capacity: 50000
hidden_size: 128

temp_init: 1.0
temp_min: 0.01
temp_decay: 0.995

window_width: 100
eval_period: 50
eval_runs: 30

loss: "smooth_l1"
update_period: 4
from_config: "config/config.yaml"